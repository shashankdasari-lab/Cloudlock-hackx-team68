{% extends "base.html" %}
{% block content %}
<div class="form-center">
  <div class="auth-card">
    <h2>Login</h2>
    <form method="post">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="muted">No account? <a href="{{ url_for('signup') }}">Sign up</a> or <a href="{{ url_for('guest') }}">continue as guest</a></p>
  </div>
</div>
{% endblock %}
